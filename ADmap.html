<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADmap — Active Directory audit tracker</title>
  <style>
:root {
  --bg: #0f1419;
  --panel: #1a222c;
  --panel-2: #212c38;
  --border: #2d3a48;
  --text: #e6edf3;
  --muted: #8b98a5;
  --accent: #4aa3ff;
  --ok: #3fb950;
  --ko: #f85149;
  --code-bg: #0b0f14;
  --spine: #3a4a5a;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  display: flex; flex-direction: column;
}

.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; flex-wrap: wrap; gap: 12px 16px;
  justify-content: space-between; align-items: center;
  padding: 9px 16px;
  background: linear-gradient(var(--panel), var(--panel-2));
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.titlewrap { display: flex; flex-direction: column; gap: 1px; }
h1 {
  margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .2px;
  background: linear-gradient(90deg, var(--text), var(--accent));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.tagline { color: var(--muted); font-size: 11px; letter-spacing: .3px; }
.summary {
  color: var(--muted); font-size: 12px; white-space: nowrap;
  padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--code-bg);
}
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* zoom controls joined into one segmented group */
.zoomgrp { display: inline-flex; }
.zoomgrp .btn { border-radius: 0; border-left-width: 0; }
.zoomgrp .btn:first-child { border-radius: 6px 0 0 6px; border-left-width: 1px; }
.zoomgrp .btn:last-child { border-radius: 0 6px 6px 0; }
.search {
  background: var(--code-bg); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; width: 210px;
}
.btn {
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 11px; font-size: 13px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn-danger:hover { border-color: var(--ko); color: var(--ko); }

/* --- Keyboard focus: a clear target on every interactive element --- */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}
.board:focus-visible { outline-offset: -2px; }

/* skip link: off-screen until focused, then anchored top-left */
.skip-link {
  position: fixed; top: 8px; left: 8px; z-index: 30;
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--accent); border-radius: 6px;
  padding: 6px 11px; font-size: 13px; text-decoration: none;
  transform: translateY(-150%); transition: transform .15s ease;
}
.skip-link:focus { transform: translateY(0); }

/* --- Board: zoom/pan container --- */
.board {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;            /* the plane is moved via transform */
  cursor: grab;
  touch-action: none;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0) 0 0 / 28px 28px;
}
.board.grabbing { cursor: grabbing; }

/* the transformed plane holding the columns */
#plane {
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
  display: flex; gap: 22px; align-items: flex-start;
  padding: 16px;
}
.column { display: flex; flex-direction: column; gap: 16px; flex: 0 0 auto; }

/* --- Boxes (grow rightward as the tree expands) --- */
.box {
  --accent: #4aa3ff;
  border: 1px solid var(--border);
  border-left: 5px solid var(--accent);
  border-radius: 10px;
  background: var(--panel);
  width: max-content;
  max-width: none;
}
.box-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px;
  background: var(--panel-2);
  border-radius: 9px 9px 0 0;
  cursor: pointer; user-select: none;
  min-width: 240px;
}
.box-head:hover { filter: brightness(1.08); }
.box-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: 0 0 10px; }
.box-title { flex: 1; font-weight: 600; font-size: 14px; white-space: nowrap; }
.box-count { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.box-count .ok { color: var(--ok); }
.box-count .ko { color: var(--ko); }
.box-body { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.box.collapsed .box-body { display: none; }
/* connector tint derived from the box color */
.box { --wire: color-mix(in srgb, var(--accent) 45%, #56687e); }

/* --- Mindmap tree: self on the left, children on the right --- */
.node { display: flex; flex-direction: row; align-items: center; }
.board.grabbing .node, .board.grabbing .box { user-select: none; }

.node-row {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; margin: 3px 0;
  white-space: nowrap; cursor: pointer; position: relative;
  border-radius: 10px;
  transition: background .12s, box-shadow .12s, border-color .12s;
}
/* branches = rounded pills */
.node.has-kids > .node-row {
  background: #22303f;
  border: 1px solid var(--wire);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,.3);
}
.node.has-kids > .node-row:hover { background: #2a3b4d; }
/* leaves = command sitting on a line */
.node:not(.has-kids) > .node-row {
  border-bottom: 2px solid var(--wire);
  border-radius: 0; padding: 3px 10px 5px;
}
.node:not(.has-kids) > .node-row:hover { background: rgba(255,255,255,.05); }

.node.has-kids[data-status="ok"] > .node-row { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.node.has-kids[data-status="ko"] > .node-row { border-color: var(--ko); box-shadow: 0 0 0 1px var(--ko); }
.node:not(.has-kids)[data-status="ok"] > .node-row { border-bottom-color: var(--ok); }
.node:not(.has-kids)[data-status="ko"] > .node-row { border-bottom-color: var(--ko); }

/* children + connectors (bracket + junction circle) */
.node-children {
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  margin-left: 28px; position: relative;
}
.node-children::before {            /* vertical spine: first to last child */
  content: ""; position: absolute; left: 0;
  top: var(--first, 15px); height: var(--spine, calc(100% - 30px));
  border-left: 2px solid var(--wire);
}
.node-children::after {             /* junction circle, at the parent level */
  content: ""; position: absolute; left: -5px; top: var(--mid, 50%); transform: translateY(-50%);
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--wire);
}
.node.collapsed > .node-children { display: none; }
.node.has-kids > .node-row::after { /* parent -> circle line */
  content: ""; position: absolute; left: 100%; top: 50%;
  width: 28px; border-top: 2px solid var(--wire);
}
.node.collapsed > .node-row::after { display: none; }
.node-children > .node { position: relative; }
.node-children > .node > .node-row { margin-left: 24px; }
.node-children > .node::before {    /* horizontal tick to the child */
  content: ""; position: absolute; left: 0; top: var(--rc, 50%);
  width: 24px; border-top: 2px solid var(--wire);
}

.caret {
  flex: 0 0 11px; width: 11px;
  color: var(--accent); font-size: 9px; cursor: pointer;
  text-align: center; transition: transform .15s ease;
}
.caret.leaf { visibility: hidden; width: 0; flex-basis: 0; margin: 0; }
.node.collapsed > .node-row > .caret { transform: rotate(-90deg); }

/* status chip (cycles — / ✓ / ✗) */
.chip {
  flex: 0 0 auto;
  width: 18px; height: 18px;
  border: 1px solid var(--border); border-radius: 50%;
  background: #0f1620; color: var(--muted);
  font-size: 10px; font-weight: 800; cursor: pointer; padding: 0; line-height: 1;
  transition: transform .1s;
}
.chip:hover { transform: scale(1.18); }
.chip.ok { background: rgba(63,185,80,.22); color: var(--ok); border-color: var(--ok); }
.chip.ko { background: rgba(248,81,73,.22); color: var(--ko); border-color: var(--ko); }

.node-content { display: inline-flex; align-items: center; gap: 6px; }
.node-label { color: var(--text); }
.node[data-status="ko"] > .node-row .node-label { color: var(--muted); text-decoration: line-through; }
.node-cmd {
  font-family: "Cascadia Code", Consolas, Menlo, monospace;
  font-size: 12px; color: #9fe0b0; white-space: pre;
}
/* Variables ($VAR) highlighted so they stand out from the command. */
.cmd-var {
  color: #ffcc66; font-weight: 700;
  background: rgba(255, 204, 102, 0.12);
  border-radius: 3px; padding: 0 2px;
}
.copy-btn {
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--muted); border-radius: 4px;
  width: 20px; height: 19px; font-size: 11px; cursor: pointer; padding: 0;
}
.copy-btn:hover { color: var(--accent); border-color: var(--accent); }
.copy-btn.copied { color: var(--ok); border-color: var(--ok); }

.note-btn {
  flex: 0 0 auto;
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--muted); border-radius: 4px;
  width: 20px; height: 19px; font-size: 11px; cursor: pointer; padding: 0;
}
.note-btn:hover { color: var(--accent); border-color: var(--accent); }
.note-btn.has-note { color: var(--accent); border-color: var(--accent); background: rgba(74,163,255,.14); }
/* --- Note modal --- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(0, 0, 0, .55);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal {
  width: min(560px, 100%);
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: 0 16px 50px rgba(0, 0, 0, .5);
  padding: 16px; display: flex; flex-direction: column; gap: 10px;
}
.modal-head { font-size: 15px; font-weight: 700; }
.modal-sub {
  font-size: 12px; color: var(--muted);
  font-family: "Cascadia Code", Consolas, Menlo, monospace;
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px;
  white-space: pre-wrap; word-break: break-word; max-height: 84px; overflow: auto;
}
.modal-textarea {
  width: 100%; min-height: 130px; resize: vertical;
  background: var(--code-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; font-size: 13px; font-family: inherit; line-height: 1.5;
}
.modal-actions { display: flex; align-items: center; gap: 8px; }
.modal-spacer { flex: 1; }
.btn-primary { border-color: var(--accent); color: var(--accent); }
.btn-primary:hover { background: rgba(74, 163, 255, .14); }

.outcome {
  font-size: 11px; color: #e3b341;
  background: rgba(227,179,65,.12);
  border: 1px solid rgba(227,179,65,.35);
  border-radius: 4px; padding: 0 5px; white-space: nowrap;
}

.credit {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 5px 16px; background: transparent;
  border-top: 1px solid var(--border);
}
.credit-text {
  font-size: 10.5px; line-height: 1.4;
  color: color-mix(in srgb, var(--muted) 70%, transparent);
}
.credit-text a { color: inherit; text-decoration: underline; }
.credit-text a:hover { color: var(--accent); }

.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  padding: 9px 16px; border-radius: 8px; font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 20;
}

  </style>
</head>

/*
 * Interactive AD mindmap (Orange Cyberdefense layout).
 *  - grid of boxes (columns = progression), placed from conf.yml.
 *  - each box holds a tree with collapsible branches.
 *  - each node: copyable command, outcome, status cycle ✓ / ✗ / —.
 * Progress is persisted via /api/progress (data/progress.json).
 */

const CYCLE = { todo: "ok", ok: "ko", ko: "todo" };
const GLYPH = { ok: "✓", ko: "✗", todo: "—" };

let tree = { nodes: [], grid: { cols: 7, rows: 3 } };
let progress = {};
const collapsed = new Set();
let filter = "";

/* ---------- Progress storage (localStorage) ---------- */
const LS_KEY = "admap:progress";
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
}
function saveProgress() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch {}
}

/* ---------- Helpers ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
// Render a command, wrapping each variable ($VAR) so it stands out.
const CMD_VAR_RE = /\$[A-Za-z_][A-Za-z0-9_]*/g;
function renderCmd(code, cmd) {
  code.textContent = "";
  let last = 0, m;
  while ((m = CMD_VAR_RE.exec(cmd)) !== null) {
    if (m.index > last) code.appendChild(document.createTextNode(cmd.slice(last, m.index)));
    code.appendChild(el("span", "cmd-var", m[0]));
    last = m.index + m[0].length;
  }
  if (last < cmd.length) code.appendChild(document.createTextNode(cmd.slice(last)));
}
const kids = (n) => (Array.isArray(n.children) ? n.children : []);
const hasKids = (n) => kids(n).length > 0;
const statusOf = (id) => (progress[id] && progress[id].status) || "todo";
const noteOf = (id) => (progress[id] && progress[id].note) || "";

function matchNode(n) {
  if (!filter) return true;
  const hay = ((n.label || "") + " " + (n.cmd || "") + " " + (n.outcome || "")).toLowerCase();
  if (hay.includes(filter)) return true;
  return kids(n).some(matchNode);
}

function rollup(node) {
  let ok = 0, ko = 0, total = 0;
  (function walk(n) {
    if (hasKids(n)) { n.children.forEach(walk); return; }
    total++;
    const s = statusOf(n.id);
    if (s === "ok") ok++; else if (s === "ko") ko++;
  })(node);
  return { ok, ko, total };
}

/* ---------- Rendering ---------- */
function render() {
  const board = document.getElementById("board");
  board.textContent = "";
  const plane = el("div");
  plane.id = "plane";
  board.appendChild(plane);

  const cols = tree.grid.cols || 7;
  const columns = [];
  for (let c = 0; c < cols; c++) {
    const col = el("div", "column");
    plane.appendChild(col);
    columns.push(col);
  }
  const boxes = tree.nodes.slice().sort((a, b) => (a.row - b.row));
  boxes.forEach((box) => {
    if (filter && !matchNode(box)) return;
    columns[box.col % cols].appendChild(renderBox(box));
  });
  alignConnectors(board);
  applyView();
  updateSummary();
}

const rowOf = (node) => node.querySelector(":scope > .node-row");

// Where a connector meets a node, within its own row: a leaf joins at its
// underline (bottom), a branch pill joins at its center.
function anchorInRow(node) {
  const r = rowOf(node);
  return node.classList.contains("has-kids") ? r.offsetTop + r.offsetHeight / 2
                                             : r.offsetTop + r.offsetHeight - 2;
}

// Lay out the tree connectors so a parent points at the midpoint between its
// first and last child anchors. Measured in layout coords (offset*), so it is
// unaffected by the board's zoom transform. Deepest branches first, so child
// heights are final before a parent measures them.
function alignConnectors(root) {
  for (const node of [...root.querySelectorAll(".node.has-kids")].reverse()) {
    const row = rowOf(node);
    if (node.classList.contains("collapsed")) {
      node.style.alignItems = "";
      if (row) row.style.marginTop = "";
      continue;
    }
    const childrenEl = node.querySelector(":scope > .node-children");
    if (!childrenEl || !row) continue;
    const kids = [...childrenEl.children].filter((e) => e.classList.contains("node"));
    if (!kids.length) continue;
    const anchor = (kid) => kid.offsetTop + anchorInRow(kid);
    const first = anchor(kids[0]);
    const last = anchor(kids[kids.length - 1]);
    const mid = (first + last) / 2;
    childrenEl.style.setProperty("--first", first + "px");
    childrenEl.style.setProperty("--spine", (last - first) + "px");
    childrenEl.style.setProperty("--mid", mid + "px");
    node.style.alignItems = "flex-start";
    row.style.marginTop = Math.max(0, mid - row.offsetHeight / 2) + "px";
  }
  root.querySelectorAll(".node-children > .node").forEach((kid) => {
    if (rowOf(kid)) kid.style.setProperty("--rc", anchorInRow(kid) + "px");
  });
}

/* ---------- Zoom / pan ---------- */
const view = { tx: 0, ty: 0, scale: 1 };
let justPanned = false;

function applyView() {
  const plane = document.getElementById("plane");
  if (plane) plane.style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.scale})`;
}
function zoomBy(factor, cx, cy) {
  const b = document.getElementById("board").getBoundingClientRect();
  if (cx == null) { cx = b.width / 2; cy = b.height / 2; }
  const ns = Math.max(0.15, Math.min(3, view.scale * factor));
  view.tx = cx - (cx - view.tx) * (ns / view.scale);
  view.ty = cy - (cy - view.ty) * (ns / view.scale);
  view.scale = ns;
  applyView();
}
function resetView() { view.tx = 0; view.ty = 0; view.scale = 1; applyView(); }

function initPanZoom() {
  const board = document.getElementById("board");
  let down = false, panning = false, pid = null, sx = 0, sy = 0, ox = 0, oy = 0;

  board.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    if (e.target.closest(".chip, .copy-btn, .note-btn")) return;
    down = true; panning = false; pid = e.pointerId;
    sx = e.clientX; sy = e.clientY; ox = view.tx; oy = view.ty;
    // no pointer capture here, so a plain click still reaches the branch
  });
  board.addEventListener("pointermove", (e) => {
    if (!down) return;
    if (!panning && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 4) {
      panning = true;
      board.classList.add("grabbing");
      try { board.setPointerCapture(pid); } catch {}
    }
    if (panning) {
      view.tx = ox + (e.clientX - sx);
      view.ty = oy + (e.clientY - sy);
      applyView();
      e.preventDefault();
    }
  });
  const end = () => {
    if (!down) return;
    down = false;
    board.classList.remove("grabbing");
    if (panning) { justPanned = true; setTimeout(() => (justPanned = false), 0); }
    panning = false;
  };
  board.addEventListener("pointerup", end);
  board.addEventListener("pointercancel", end);
  board.addEventListener("selectstart", (e) => { if (panning) e.preventDefault(); });

  board.addEventListener("wheel", (e) => {
    e.preventDefault();
    const b = board.getBoundingClientRect();
    zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - b.left, e.clientY - b.top);
  }, { passive: false });
}

function renderBox(box) {
  const wrap = el("div", "box" + (collapsed.has(box.id) ? " collapsed" : ""));
  wrap.dataset.id = box.id;
  const color = box.color || "#4aa3ff";
  wrap.style.setProperty("--accent", color);

  const head = el("div", "box-head");
  head.appendChild(el("span", "caret", "▾"));
  head.appendChild(el("span", "box-dot"));
  head.appendChild(el("span", "box-title", box.label));
  const r = rollup(box);
  const cnt = el("span", "box-count");
  cnt.innerHTML = `<b class="ok">${r.ok}</b>✓ <b class="ko">${r.ko}</b>✗<span class="muted">/${r.total}</span>`;
  head.appendChild(cnt);
  head.addEventListener("click", () => { if (!justPanned) toggle(box.id, wrap); });
  wrap.appendChild(head);

  const body = el("div", "box-body");
  kids(box).forEach((c) => { if (!filter || matchNode(c)) body.appendChild(renderNode(c)); });
  wrap.appendChild(body);
  return wrap;
}

function renderNode(node) {
  const branch = hasKids(node);
  const open = branch && !collapsed.has(node.id) || (filter && branch);
  const wrap = el("div", "node" + (branch ? " has-kids" : "") + (branch && !open ? " collapsed" : ""));
  wrap.dataset.id = node.id;
  wrap.dataset.status = statusOf(node.id);

  const row = el("div", "node-row");

  const caret = el("span", "caret" + (branch ? "" : " leaf"), branch ? "▾" : "");
  row.appendChild(caret);

  const chip = el("button", "chip " + statusOf(node.id), GLYPH[statusOf(node.id)]);
  chip.title = "Click: — → ✓ → ✗";
  chip.addEventListener("click", (e) => { e.stopPropagation(); cycleStatus(node.id, wrap, chip); });
  row.appendChild(chip);

  const content = el("span", "node-content");
  if (node.cmd) {
    const code = el("code", "node-cmd");
    renderCmd(code, node.cmd);
    content.appendChild(code);
    const copy = el("button", "copy-btn", "⧉");
    copy.title = "Copy command";
    copy.addEventListener("click", (e) => { e.stopPropagation(); doCopy(node.cmd, copy); });
    content.appendChild(copy);
  } else {
    content.appendChild(el("span", "node-label", node.label || "·"));
  }
  if (node.outcome) {
    const out = el("span", "outcome");
    out.textContent = "→ " + node.outcome;
    content.appendChild(out);
  }
  row.appendChild(content);

  // a bubble just signals a note exists; its content opens in a modal
  const note = noteOf(node.id);
  const noteBtn = el("button", "note-btn" + (note ? " has-note" : ""), note ? "💬" : "✎");
  noteBtn.title = note ? "View / edit note" : "Add a note";
  noteBtn.addEventListener("click", (e) => { e.stopPropagation(); openNoteModal(node); });
  row.appendChild(noteBtn);

  if (branch) row.addEventListener("click", () => { if (!justPanned) toggle(node.id, wrap); });
  wrap.appendChild(row);

  if (branch) {
    const ch = el("div", "node-children");
    node.children.forEach((c) => { if (!filter || matchNode(c)) ch.appendChild(renderNode(c)); });
    wrap.appendChild(ch);
  }
  return wrap;
}

function doCopy(text, btn) {
  const done = () => { btn.textContent = "✓"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = "⧉"; btn.classList.remove("copied"); }, 1000); };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(done)
    .catch(() => {
      const t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); done(); } catch { toast("Copy failed"); }
      t.remove();
    });
}

/* ---------- State ---------- */
function toggle(id, elNode) {
  if (filter) return;
  if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
  elNode.classList.toggle("collapsed");
  alignConnectors(document.getElementById("board"));
}

function cycleStatus(id, wrap, chip) {
  const next = CYCLE[statusOf(id)];
  progress[id] = progress[id] || {};
  progress[id].status = next;
  wrap.dataset.status = next;
  chip.className = "chip " + next;
  chip.textContent = GLYPH[next];
  saveProgress();
  refreshCounts();
  updateSummary();
}

function openNoteModal(node) {
  const id = node.id;
  const overlay = el("div", "modal-overlay");
  const modal = el("div", "modal");

  modal.appendChild(el("div", "modal-head", noteOf(id) ? "Edit note" : "Add a note"));
  const sub = el("div", "modal-sub");
  sub.textContent = (node.cmd || node.label || "This step").trim();
  modal.appendChild(sub);

  const ta = el("textarea", "modal-textarea");
  ta.value = noteOf(id);
  ta.placeholder = "Write a note for this step… (Ctrl+Enter to save)";
  modal.appendChild(ta);

  const actions = el("div", "modal-actions");
  if (noteOf(id)) {
    const del = el("button", "btn btn-danger", "Delete");
    del.addEventListener("click", () => commit(""));
    actions.appendChild(del);
  }
  actions.appendChild(el("span", "modal-spacer"));
  const cancel = el("button", "btn", "Cancel");
  cancel.addEventListener("click", close);
  const save = el("button", "btn btn-primary", "Save");
  save.addEventListener("click", () => commit(ta.value));
  actions.append(cancel, save);
  modal.appendChild(actions);

  overlay.appendChild(modal);
  overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(overlay);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  function onKey(e) {
    if (e.key === "Escape") close();
    else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) commit(ta.value);
  }
  function close() {
    document.removeEventListener("keydown", onKey);
    overlay.remove();
  }
  function commit(text) {
    progress[id] = progress[id] || {};
    const t = (text || "").trim();
    if (t) progress[id].note = t; else delete progress[id].note;
    saveProgress();
    close();
    render();
  }
}

function refreshCounts() {
  document.querySelectorAll(".box").forEach((box) => {
    const node = tree.nodes.find((n) => n.id === box.dataset.id);
    if (!node) return;
    const r = rollup(node);
    const c = box.querySelector(":scope > .box-head > .box-count");
    if (c) c.innerHTML = `<b class="ok">${r.ok}</b>✓ <b class="ko">${r.ko}</b>✗<span class="muted">/${r.total}</span>`;
  });
}

function updateSummary() {
  let ok = 0, ko = 0, total = 0;
  tree.nodes.forEach((b) => { const r = rollup(b); ok += r.ok; ko += r.ko; total += r.total; });
  const done = ok + ko, pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("summary").textContent =
    `✓ ${ok} · ✗ ${ko} · ${done}/${total} tested (${pct}%)`;
}

function eachNode(fn) {
  (function walk(list) { list.forEach((n) => { fn(n); if (hasKids(n)) walk(n.children); }); })(tree.nodes);
}
function setAllCollapsed(flag) {
  collapsed.clear();
  if (flag) eachNode((n) => { if (hasKids(n)) collapsed.add(n.id); });
  render();
}

/* ---------- Misc ---------- */
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 1800);
}
function resetProgress() {
  if (!confirm("Reset all progress?")) return;
  progress = {};
  saveProgress();
  render();
  toast("Progress reset");
}

/* ---------- Startup ---------- */
function boot() {
  progress = loadProgress();
  tree = { nodes: MINDMAP.nodes || [], grid: MINDMAP.grid || { cols: 7, rows: 3 } };
  // default: boxes open, inner branches collapsed
  tree.nodes.forEach((box) => kids(box).forEach(function mark(n) {
    if (hasKids(n)) { collapsed.add(n.id); n.children.forEach(mark); }
  }));
  render();
}

document.getElementById("expand-all").addEventListener("click", () => setAllCollapsed(false));
document.getElementById("collapse-all").addEventListener("click", () => setAllCollapsed(true));
document.getElementById("reset").addEventListener("click", resetProgress);
document.getElementById("search").addEventListener("input", (e) => {
  filter = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("zoom-in").addEventListener("click", () => zoomBy(1.2));
document.getElementById("zoom-out").addEventListener("click", () => zoomBy(1 / 1.2));
document.getElementById("zoom-reset").addEventListener("click", resetView);
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "+" || e.key === "=") zoomBy(1.2);
  else if (e.key === "-") zoomBy(1 / 1.2);
  else if (e.key === "0") resetView();
});

initPanZoom();
try { boot(); } catch (e) { toast("Load error: " + e.message); }

  </script>
